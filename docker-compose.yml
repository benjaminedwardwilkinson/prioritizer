services:
  prioritizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prioritizer
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
    volumes:
      # Named volume for persistent user profile, snapshots, and experiments data
      - prioritizer_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  prioritizer_data:
    name: prioritizer_data
